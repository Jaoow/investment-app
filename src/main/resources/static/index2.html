<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Arquivo</title>
</head>
<body>
<h1>Upload de Arquivo</h1>
<form id="uploadForm">
    <label for="portfolioId">Portfolio ID:</label>
    <input type="text" id="portfolioId" name="portfolioId" required><br><br>

    <label for="file">Escolha o arquivo:</label>
    <input type="file" id="file" name="file" accept=".xlsx" required><br><br>

    <button type="submit">Enviar</button>
</form>
<p id="result"></p>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const portfolioId = document.getElementById('portfolioId').value;
        const fileInput = document.getElementById('file');
        const file = fileInput.files[0];

        if (!portfolioId || !file) {
            alert("Por favor, preencha o Portfolio ID e escolha um arquivo.");
            return;
        }

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch(`http://localhost:8080/v1/portfolio/${portfolioId}/movement/import`, {
                method: 'POST',
                body: formData
            });

            const resultElement = document.getElementById('result');

            if (response.ok) {
                const resultText = await response.text();
                resultElement.textContent = `Sucesso: ${resultText}`;
            } else {
                const errorText = await response.text();
                resultElement.textContent = `Erro: ${errorText}`;
            }
        } catch (error) {
            document.getElementById('result').textContent = `Erro: ${error.message}`;
        }
    });
</script>
</body>
</html>
