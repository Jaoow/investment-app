spring.application.name=investment-app
spring.config.import=optional:file:./.env.local[.properties]
brapi.api.token=${BRAPI_API_TOKEN}
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=1200000
security.jwt.refresh-expiration-time=604800000

## PostgreSQL Database Connection
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database schema is managed exclusively by Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
#spring.jpa.show-sql=true

# Cache Configuration
spring.cache.type=caffeine
brapi.quote.cache-ttl-seconds=60
brapi.quote.cache-max-size=1000
investize.recommendations.max-quote-age=15m
investize.recommendations.weights.ceiling-distance=0.50
investize.recommendations.weights.daily-drop=0.20
investize.recommendations.weights.allocation-gap=0.30

# Server Port
server.port=${SERVER_PORT:8080}
investize.cors.allowed-origins=${INVESTIZE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
