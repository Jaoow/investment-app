spring.application.name=investment-app
brapi.api.token=kudT4RSj9HrGGgGMJ8h3WF

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/investmentdb
spring.datasource.username=investmentuser
spring.datasource.password=investmentpass
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Port
server.port=8080
