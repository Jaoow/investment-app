name: investize-local

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: investmentdb
      POSTGRES_USER: investmentuser
      POSTGRES_PASSWORD: investmentpass
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investmentuser -d investmentdb"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
