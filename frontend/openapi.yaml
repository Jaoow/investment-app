openapi: 3.1.0
info:
  title: Investize API
  version: 0.1.0
  description: |
    Checked-in UI contract for the endpoints consumed by the SPA.
    The backend springdoc endpoint is authoritative and this document must be
    reconciled with GET /v3/api-docs when backend DTOs change.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error'
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
  /v1/portfolio:
    get:
      operationId: listPortfolios
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Portfolio'
    post:
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioRequest'
      responses:
        '201':
          description: Created portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '400':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getPortfolio
      responses:
        '200':
          description: Portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: updatePortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioRequest'
      responses:
        '200':
          description: Updated portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
    delete:
      operationId: deletePortfolio
      responses:
        '204':
          description: Deleted
  /v1/portfolio/{portfolioId}/summary:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getPortfolioSummary
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Portfolio valuation summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
  /v1/portfolio/{portfolioId}/classes:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getPortfolioClasses
      responses:
        '200':
          description: Server-computed portfolio allocation by asset class
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortfolioClass' }
        '503':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/overview:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getPortfolioOverview
      responses:
        '200':
          description: Portfolio totals and positions aggregated by the API
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioOverview' }
        '503':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/classes/{classId}:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
      - name: classId
        in: path
        required: true
        schema: { type: string, enum: [equities, realEstate, etfs, bdrs, fixedIncome, treasury] }
    get:
      operationId: getPortfolioClassDetail
      responses:
        '200':
          description: Server-computed summary and positions for an asset class
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioClassDetail' }
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/assets/{ticker}:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
      - name: ticker
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPortfolioAssetDetail
      responses:
        '200':
          description: Consolidated asset position with API-computed allocations and profitability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioAssetDetail' }
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/suggestions:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    post:
      operationId: suggestContribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionRequest'
      responses:
        '200':
          description: Contribution simulation; does not create movements or orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suggestion'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/recommendations/calculate:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    post:
      operationId: calculateRecommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationCalculationRequest'
      responses:
        '200':
          description: Portfolio-scoped contribution simulation; does not create movements or orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationCalculation'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/assets/{tickerSymbol}/ceiling:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
      - name: tickerSymbol
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCeiling
      responses:
        '200':
          description: Asset ceiling preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ceiling'
    put:
      operationId: setCeiling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CeilingRequest'
      responses:
        '200':
          description: Updated ceiling preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ceiling'
    delete:
      operationId: deleteCeiling
      responses:
        '204':
          description: Deleted
  /v1/portfolio/{portfolioId}/assets/{tickerSymbol}/ceiling/history:
    get:
      operationId: getCeilingHistory
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - name: tickerSymbol
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Price ceiling changes, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCeilingHistory'
  /v1/portfolio/{portfolioId}/asset-settings:
    get:
      operationId: getAssetSettings
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: Configured tickers, effective portfolio targets and ceilings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetSetting'
  /v1/portfolio/{portfolioId}/contribution-eligibility:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getContributionEligibility
      responses:
        '200':
          description: Per-portfolio asset participation in contribution suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionEligibility'
    put:
      operationId: saveContributionEligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributionEligibility'
      responses:
        '200':
          description: Saved participation settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionEligibility'
        '403':
          $ref: '#/components/responses/Error'
  /v1/ticker/register:
    post:
      operationId: registerTicker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, category]
              properties:
                symbol: { type: string, minLength: 2, maxLength: 12 }
                category:
                  { type: string, enum: [EQUITIES, REAL_ESTATE_FUNDS, ETFS, BDRS, FIXED_INCOME, TREASURY] }
      responses:
        '200':
          description: Registered or existing ticker; never changes existing category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticker'
        '400':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/allocations:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getAllocations
      responses:
        '200':
          description: Target allocations by category and ticker
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryAllocation'
    post:
      operationId: setAllocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CategoryAllocation'
      responses:
        '201':
          description: Allocations saved
        '400':
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceAllocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CategoryAllocation'
      responses:
        '200':
          description: Allocations replaced
        '400':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/rebalance:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getRebalance
      responses:
        '200':
          description: Rebalance recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rebalance'
  /v1/ticker/search:
    get:
      operationId: searchTickers
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - name: sector
          in: query
          schema:
            type: string
        - name: subSector
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [EQUITIES, REAL_ESTATE_FUNDS, ETFS, BDRS, FIXED_INCOME, TREASURY]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Ticker page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTickers'
  /v1/ticker/{symbol}:
    get:
      operationId: getTicker
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticker detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticker'
  /v1/quotes:
    get:
      operationId: getQuote
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
        - name: range
          in: query
          schema:
            type: string
        - name: interval
          in: query
          schema:
            type: string
        - name: fundamental
          in: query
          schema:
            type: boolean
        - name: dividends
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Market quote and optional price history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '503':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/movement:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getMovements
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged movements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMovements'
    post:
      operationId: createMovement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '201':
          description: Movement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
  /v1/portfolio/{portfolioId}/movement/import:
    post:
      operationId: importMovements
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Imported movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movement'
        '400':
          $ref: '#/components/responses/Error'
  /v1/portfolio/{portfolioId}/movement/{movementId}:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
      - name: movementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getMovement
      responses:
        '200':
          description: Movement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
    put:
      operationId: updateMovement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '200':
          description: Updated movement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
    delete:
      operationId: deleteMovement
      responses:
        '204':
          description: Deleted
  /v1/portfolio/{portfolioId}/shares:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: listShares
      responses:
        '200':
          description: Share links without their secret tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'
    post:
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
      responses:
        '201':
          description: Created link path; treat as secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedShare'
  /v1/portfolio/{portfolioId}/shares/{shareId}:
    delete:
      operationId: revokeShare
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - name: shareId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Revoked
  /public/portfolio-shares/{token}:
    get:
      operationId: getPublicShare
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Read-only snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShare'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        default: 20
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Decimal:
      description: Exact decimal value; API may emit a JSON number until its wire contract is migrated.
      oneOf:
        - type: string
        - type: number
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 3, maxLength: 255 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 255 }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
    PortfolioRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    Portfolio:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        totalAssets: { type: integer }
    PortfolioSummary:
      type: object
      properties:
        portfolioId: { type: integer, format: int64 }
        totalInvested: { $ref: '#/components/schemas/Decimal' }
        currentValue: { $ref: '#/components/schemas/Decimal' }
        profitOrLoss: { $ref: '#/components/schemas/Decimal' }
        percentageChange: { $ref: '#/components/schemas/Decimal' }
        assetSummaries:
          type: array
          items: { $ref: '#/components/schemas/AssetSummary' }
    AssetSummary:
      type: object
      properties:
        tickerSymbol: { type: string }
        quantity: { $ref: '#/components/schemas/Decimal' }
        averagePrice: { $ref: '#/components/schemas/Decimal' }
        totalInvested: { $ref: '#/components/schemas/Decimal' }
        currentValue: { $ref: '#/components/schemas/Decimal' }
        profitOrLoss: { $ref: '#/components/schemas/Decimal' }
        percentageChange: { $ref: '#/components/schemas/Decimal' }
    PortfolioClass:
      type: object
      required: [id, name, currentPercentage, targetPercentage, currentValue, profitability, assetsCount]
      properties:
        id: { type: string }
        name: { type: string }
        currentPercentage: { $ref: '#/components/schemas/Decimal' }
        targetPercentage: { $ref: '#/components/schemas/Decimal' }
        currentValue: { $ref: '#/components/schemas/Decimal' }
        profitability: { $ref: '#/components/schemas/Decimal' }
        assetsCount: { type: integer }
        investedAmount: { $ref: '#/components/schemas/Decimal' }
        profitAmount: { $ref: '#/components/schemas/Decimal' }
    PortfolioClassDetail:
      type: object
      properties:
        summary: { $ref: '#/components/schemas/PortfolioClass' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetSummary' }
        classes:
          type: array
          items: { $ref: '#/components/schemas/PortfolioClass' }
    PortfolioOverview:
      type: object
      required: [portfolioId, patrimony, investedAmount, profitAmount, profitPercentage, assetsCount, assets]
      properties:
        portfolioId: { type: integer, format: int64 }
        patrimony: { $ref: '#/components/schemas/Decimal' }
        investedAmount: { $ref: '#/components/schemas/Decimal' }
        profitAmount: { $ref: '#/components/schemas/Decimal' }
        profitPercentage: { $ref: '#/components/schemas/Decimal' }
        assetsCount: { type: integer }
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetSummary' }
    PortfolioAssetDetail:
      type: object
      properties:
        ticker: { type: string }
        name: { type: string }
        sector: { type: string }
        quantity: { $ref: '#/components/schemas/Decimal' }
        averagePrice: { $ref: '#/components/schemas/Decimal' }
        currentPrice: { $ref: '#/components/schemas/Decimal' }
        investedAmount: { $ref: '#/components/schemas/Decimal' }
        currentAmount: { $ref: '#/components/schemas/Decimal' }
        profitAmount: { $ref: '#/components/schemas/Decimal' }
        profitPercentage: { $ref: '#/components/schemas/Decimal' }
        allocationInClass: { $ref: '#/components/schemas/Decimal' }
        targetAllocationInClass: { $ref: '#/components/schemas/Decimal' }
        allocationInPortfolio: { $ref: '#/components/schemas/Decimal' }
        targetAllocationInPortfolio: { $ref: '#/components/schemas/Decimal' }
        dailyVariation: { $ref: '#/components/schemas/Decimal' }
    SuggestionRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: BRL }
    RecommendationCalculationRequest:
      type: object
      required: [investmentAmount]
      properties:
        investmentAmount: { allOf: [{ $ref: '#/components/schemas/Decimal' }], exclusiveMinimum: 0 }
    RecommendationCalculation:
      type: object
      properties:
        investmentAmount: { $ref: '#/components/schemas/Decimal' }
        allocatedAmount: { $ref: '#/components/schemas/Decimal' }
        remainingAmount: { $ref: '#/components/schemas/Decimal' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }
        excludedAssets:
          type: array
          items: { $ref: '#/components/schemas/ExcludedAsset' }
        disclaimer: { type: string }
    Recommendation:
      type: object
      properties:
        ticker: { type: string }
        assetName: { type: string }
        score: { $ref: '#/components/schemas/Decimal' }
        recommendationLevel: { type: string, enum: [STRONG_BUY, MODERATE_BUY, NEUTRAL, LOW_PRIORITY] }
        suggestedAmount: { $ref: '#/components/schemas/Decimal' }
        suggestedQuantity: { $ref: '#/components/schemas/Decimal' }
        currentAllocation: { $ref: '#/components/schemas/Decimal' }
        targetAllocation: { $ref: '#/components/schemas/Decimal' }
        currentPrice: { $ref: '#/components/schemas/Decimal' }
        ceilingPrice: { $ref: '#/components/schemas/Decimal' }
        dailyVariation: { $ref: '#/components/schemas/Decimal' }
        explanation:
          type: array
          items: { type: string }
        quoteProvider: { type: string }
        quoteObservedAt: { type: string, format: date-time }
    Suggestion:
      type: object
      properties:
        requestedAmount: { $ref: '#/components/schemas/Decimal' }
        allocatedAmount: { $ref: '#/components/schemas/Decimal' }
        remainingAmount: { $ref: '#/components/schemas/Decimal' }
        currency: { type: string }
        disclaimer: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/SuggestionItem' }
        excludedAssets:
          type: array
          items: { $ref: '#/components/schemas/ExcludedAsset' }
    SuggestionItem:
      type: object
      properties:
        tickerSymbol: { type: string }
        assetName: { type: string }
        quantity: { $ref: '#/components/schemas/Decimal' }
        unitPrice: { $ref: '#/components/schemas/Decimal' }
        estimatedValue: { $ref: '#/components/schemas/Decimal' }
        score: { $ref: '#/components/schemas/Decimal' }
        ceilingPrice: { $ref: '#/components/schemas/Decimal' }
        ceilingDistancePercentage: { $ref: '#/components/schemas/Decimal' }
        dailyChangePercent: { $ref: '#/components/schemas/Decimal' }
        currentPercentage: { $ref: '#/components/schemas/Decimal' }
        targetPercentage: { $ref: '#/components/schemas/Decimal' }
        reasons:
          type: array
          items: { type: string }
        quoteProvider: { type: string }
        quoteObservedAt: { type: string, format: date-time }
    ExcludedAsset:
      type: object
      properties:
        tickerSymbol: { type: string }
        reason: { type: string }
    CeilingRequest:
      type: object
      required: [priceCeiling]
      properties:
        priceCeiling: { $ref: '#/components/schemas/Decimal' }
    Ceiling:
      type: object
      properties:
        tickerSymbol: { type: string }
        priceCeiling: { $ref: '#/components/schemas/Decimal' }
    ContributionEligibility:
      type: object
      required: [assets]
      properties:
        assets:
          type: object
          additionalProperties: { type: boolean }
    CeilingHistory:
      type: object
      required: [id, tickerSymbol, action, changedAt]
      properties:
        id: { type: integer, format: int64 }
        tickerSymbol: { type: string }
        previousPrice:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Decimal'
        priceCeiling:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Decimal'
        action: { type: string, enum: [SET, REMOVED, BASELINE] }
        changedAt: { type: string, format: date-time }
    PageCeilingHistory:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/CeilingHistory' }
        page:
          $ref: '#/components/schemas/PageMetadata'
    AssetSetting:
      type: object
      required:
        [
          tickerSymbol,
          allocationPercentage,
          categoryTargetPercentage,
          assetTargetPercentage,
        ]
      properties:
        tickerSymbol: { type: string }
        category: { type: string, enum: [EQUITIES, REAL_ESTATE_FUNDS, ETFS, BDRS, FIXED_INCOME, TREASURY] }
        categoryTargetPercentage: { $ref: '#/components/schemas/Decimal' }
        assetTargetPercentage: { $ref: '#/components/schemas/Decimal' }
        allocationPercentage: { $ref: '#/components/schemas/Decimal' }
        priceCeiling:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Decimal'
    CategoryAllocation:
      type: object
      properties:
        category: { type: string, enum: [EQUITIES, REAL_ESTATE_FUNDS, ETFS, BDRS, FIXED_INCOME, TREASURY] }
        categoryTargetPercentage: { $ref: '#/components/schemas/Decimal' }
        assetAllocations:
          type: array
          items:
            type: object
            properties:
              tickerSymbol: { type: string }
              targetPercentage: { $ref: '#/components/schemas/Decimal' }
    Rebalance:
      type: object
      properties:
        tickerSymbol: { type: string }
        action: { type: string, enum: [BUY, SELL] }
        quantity: { $ref: '#/components/schemas/Decimal' }
        currentPercentage: { $ref: '#/components/schemas/Decimal' }
        targetPercentage: { $ref: '#/components/schemas/Decimal' }
    Ticker:
      type: object
      properties:
        symbol: { type: string }
        tickerSymbol: { type: string }
        name: { type: string }
        category: { type: string }
        sector: { type: string }
        subSector: { type: string }
        priceCeiling: { $ref: '#/components/schemas/Decimal' }
    PageTickers:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Ticker' }
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMovements:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Movement' }
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      properties:
        size: { type: integer }
        number: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Quote:
      type: object
      properties:
        symbol: { type: string }
        currency: { type: string }
        regularMarketTime: { type: string }
        fetchedAt: { type: string, format: date-time }
        shortName: { type: string }
        longName: { type: string }
        regularMarketPrice: { $ref: '#/components/schemas/Decimal' }
        regularMarketChange: { $ref: '#/components/schemas/Decimal' }
        regularMarketChangePercent: { $ref: '#/components/schemas/Decimal' }
        regularMarketDayHigh: { $ref: '#/components/schemas/Decimal' }
        regularMarketDayLow: { $ref: '#/components/schemas/Decimal' }
        regularMarketPreviousClose: { $ref: '#/components/schemas/Decimal' }
        historicalDataPrice:
          type: array
          items:
            type: object
            properties:
              date: { type: integer, format: int64 }
              close: { $ref: '#/components/schemas/Decimal' }
    MovementRequest:
      type: object
      required: [tickerSymbol, quantity, price, type, date]
      properties:
        tickerSymbol: { type: string }
        quantity: { $ref: '#/components/schemas/Decimal' }
        price: { $ref: '#/components/schemas/Decimal' }
        type: { type: string, enum: [BUY, SELL] }
        date: { type: string, format: date }
    Movement:
      allOf:
        - $ref: '#/components/schemas/MovementRequest'
        - type: object
          properties:
            id: { type: integer, format: int64 }
    CreateShareRequest:
      type: object
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time }
        includeValues: { type: boolean, default: false }
    CreatedShare:
      type: object
      properties:
        id: { type: integer, format: int64 }
        accessPath: { type: string }
        expiresAt: { type: string, format: date-time }
        includeValues: { type: boolean }
    Share:
      type: object
      properties:
        id: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        includeValues: { type: boolean }
    PublicShare:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        includesValues: { type: boolean }
        assets:
          type: array
          items:
            type: object
            properties:
              tickerSymbol: { type: string }
              quantity: { $ref: '#/components/schemas/Decimal' }
              unitPrice: { $ref: '#/components/schemas/Decimal' }
              marketValue: { $ref: '#/components/schemas/Decimal' }
              currency: { type: string }
              quoteProvider: { type: string }
              quoteObservedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [timestamp, status, code, message, details]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
