name: investment-app

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: investmentdb
      POSTGRES_USER: investmentuser
      POSTGRES_PASSWORD: investmentpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investmentuser -d investmentdb"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/investmentdb
      JDBC_DATABASE_USERNAME: investmentuser
      JDBC_DATABASE_PASSWORD: investmentpass
      BRAPI_API_TOKEN: ${BRAPI_API_TOKEN:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-aW52ZXN0bWVudC1hcHAtbG9jYWwtZGV2ZWxvcG1lbnQtand0LXNlY3JldC1rZXktMzJieXRlcw==}
      SERVER_PORT: 8080
      INVESTIZE_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../investment-app-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: investize-local_postgres_data
    external: true
